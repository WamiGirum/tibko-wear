<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tibko WEAR - Custom Order</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tbkoNavy: '#1D3B6A',
            tbkoRust: '#B85C28',
            tbkoGold: '#D6923E',
            tbkoBg: '#F8F9FA'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-tbkoBg text-gray-800 font-sans p-4 pb-20">

  <!-- Back Button -->
  <a href="index.html" class="text-sm text-tbkoNavy font-bold mb-4 inline-block">← ወደ ካታሎግ ተመለስ</a>

  <h2 class="text-xl font-bold text-tbkoNavy mb-1">ብጁ ትዕዛዝ (Custom Design)</h2>
  <p class="text-xs text-gray-600 mb-3">ቲሸርት ላይ እንዲታተም የሚፈልጉትን ዲዛይን (ምስል ወይም PDF) ያያይዙ</p>

  <!-- 50% Advance Notice Banner -->
  <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs mb-4 font-medium flex items-center space-x-2">
    <span class="text-base">⚠️</span>
    <span>ማሳሰቢያ፦ ለብጁ (Custom) ትዕዛዞች <strong>50% ቅድመ ክፍያ (ቀብድ)</strong> መክፈል ግዴታ ነው።</span>
  </div>

  <form id="customForm" class="space-y-4">
    
    <!-- Phone Number Input -->
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <label class="block text-xs font-bold text-tbkoNavy mb-1">ስልክ ቁጥር <span class="text-red-500">*</span></label>
      <input type="tel" id="phone" placeholder="0912345678" class="w-full text-xs p-3 border rounded-lg focus:outline-none focus:border-tbkoNavy font-semibold" required>
    </div>

    <!-- File Upload Area -->
    <div class="border-2 border-dashed border-tbkoNavy/40 bg-white p-6 rounded-xl text-center">
      <div class="text-4xl mb-2">📁</div>
      <p class="text-xs font-semibold text-tbkoNavy">ምስል ወይም PDF ፋይል ይምረጡ</p>
      <p class="text-[10px] text-gray-400 mt-1">PNG, JPG, PDF (Up to 10MB)</p>

      <input type="file" id="fileInput" accept=".png, .jpg, .jpeg, .pdf" class="hidden" onchange="showFileName()">
      <label for="fileInput" class="inline-block mt-3 bg-tbkoNavy text-white text-xs px-4 py-2 rounded-lg cursor-pointer hover:bg-slate-800 transition">
        ፋይል ፈልግ (Browse)
      </label>

      <p id="fileNameDisplay" class="text-xs text-tbkoRust font-bold mt-3 hidden"></p>
    </div>

    <!-- Instructions Text Box -->
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <label class="block text-xs font-bold text-tbkoNavy mb-2">ተጨማሪ መመሪያ (Optional)</label>
      <textarea id="desc" rows="3" placeholder="ምስሉ ደረት ላይ በግራ ይሁን? ወይም ሌላ አስተያየት..." class="w-full text-xs p-3 border rounded-lg focus:outline-none focus:border-tbkoNavy"></textarea>
    </div>

    <!-- Size & Quantity -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-tbkoNavy mb-1">መጠን (Size)</label>
        <select id="size" class="w-full text-xs p-2.5 border rounded-lg bg-white">
          <option>Small (S)</option>
          <option>Medium (M)</option>
          <option>Large (L)</option>
          <option>X-Large (XL)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-tbkoNavy mb-1">ብዛት (Qty)</label>
        <input id="qty" type="number" value="1" min="1" class="w-full text-xs p-2.5 border rounded-lg" onchange="calculateCustomEstimate()">
      </div>
    </div>

    <!-- Live Estimate Box -->
    <div class="bg-white p-3 rounded-xl border border-gray-200 text-xs space-y-1">
      <div class="flex justify-between text-gray-600">
        <span>ግምታዊ ጠቅላላ ዋጋ:</span>
        <span id="customTotal" class="font-bold text-tbkoNavy">1,200 ETB</span>
      </div>
      <div class="flex justify-between text-tbkoRust font-bold">
        <span>የሚፈለግ ቅድመ ክፍያ (50%):</span>
        <span id="customAdvance">600 ETB</span>
      </div>
    </div>

    <!-- Next / Proceed Button -->
    <button type="button" onclick="proceedToCheckout(event)" class="w-full bg-tbkoRust hover:bg-orange-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition flex justify-center items-center space-x-2">
      <span>ወደ ክፍያ ቀጥል (Proceed to Checkout)</span>
      <span>➔</span>
    </button>
  </form>

  <script>
    const UNIT_PRICE = 1200; // Custom T-shirt base price
    const IMGBB_API_KEY = "f8da64ef6dbca33ee35805ef6ec421e4";

    function showFileName() {
      const fileInput = document.getElementById('fileInput');
      const display = document.getElementById('fileNameDisplay');
      if (fileInput.files.length > 0) {
        display.innerText = "📌 የተመረጠ ፋይል: " + fileInput.files[0].name;
        display.classList.remove('hidden');
      }
    }

    function calculateCustomEstimate() {
      const qty = parseInt(document.getElementById('qty').value) || 1;
      const total = qty * UNIT_PRICE;
      const advance = total * 0.50;

      document.getElementById('customTotal').innerText = total + " ETB";
      document.getElementById('customAdvance').innerText = advance + " ETB";
    }

    async function proceedToCheckout(event) {
      const phone = document.getElementById('phone').value.trim();
      const fileInput = document.getElementById('fileInput');
      
      if (!phone) {
        alert("እባክዎን ስልክ ቁጥርዎን ያስገቡ!");
        return;
      }

      if (fileInput.files.length === 0) {
        alert("እባክዎን ዲዛይን (ምስል ወይም PDF) ይምረጡ!");
        return;
      }

      const btn = event.currentTarget;
      const originalContent = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "<span>ዲዛይኑ እየተጫነ ነው... ⏳</span>";

      try {
        // 1. ዲዛይኑን ወደ ImgBB መጫን
        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        let designUrl = "";
        if (data.success) {
          designUrl = data.data.url;
        } else {
          throw new Error("የዲዛይን ፎቶውን መጫን አልተቻለም።");
        }

        const qty = parseInt(document.getElementById('qty').value) || 1;
        const totalAmount = qty * UNIT_PRICE;
        const requiredAdvance = totalAmount * 0.50;

        // 2. መረጃውን ከነ ፎቶ ሊንኩ ማስቀመጥ
        const customOrderData = {
          isCustom: true,
          phone: phone,
          fileName: file.name,
          designImage: designUrl,
          description: document.getElementById('desc').value,
          size: document.getElementById('size').value,
          qty: qty,
          unitPrice: UNIT_PRICE,
          totalAmount: totalAmount,
          advancePercentage: 50,
          requiredAdvance: requiredAdvance
        };

        localStorage.setItem('tbko_pending_order', JSON.stringify(customOrderData));

        // 3. ወደ Checkout መሸጋገር
        window.location.href = "checkout.html";

      } catch (err) {
        alert("ስህተት፦ " + err.message);
        btn.disabled = false;
        btn.innerHTML = originalContent;
      }
    }

    calculateCustomEstimate();
  </script>
</body>
</html>
