<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tibko WEAR - Checkout</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tbkoNavy: '#1D3B6A',
            tbkoRust: '#B85C28',
            tbkoGold: '#D6923E',
            tbkoBg: '#F8F9FA'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-tbkoBg text-gray-800 font-sans p-4 pb-20">

  <!-- Header & Back Button -->
  <div class="flex justify-between items-center mb-4">
    <a href="index.html" class="text-sm text-tbkoNavy font-bold">← ወደ ካታሎግ ተመለስ</a>
    <span id="orderIdTag" class="text-xs font-mono font-bold bg-tbkoRust text-white px-2 py-1 rounded">#TBK-0000</span>
  </div>

  <h2 class="text-xl font-bold text-tbkoNavy mb-2">ትዕዛዝ አረጋግጥ & ክፍያ</h2>

  <!-- Contact Info Section (Phone & Telegram Username) -->
  <div class="bg-white p-4 rounded-xl shadow-sm border mb-4 space-y-3">
    <div>
      <label class="block text-xs font-bold text-tbkoNavy mb-1">ስልክ ቁጥር <span class="text-red-500">*</span></label>
      <input type="tel" id="phone" placeholder="0912345678" class="w-full text-xs p-3 border rounded-lg focus:outline-none focus:border-tbkoNavy font-semibold" required>
    </div>
    
    <div>
      <label class="block text-xs font-bold text-tbkoNavy mb-1">የቴሌግራም ዩዘርኔም (Telegram Username) <span class="text-red-500">*</span></label>
      <input type="text" id="tgUsername" placeholder="@username" class="w-full text-xs p-3 border rounded-lg focus:outline-none focus:border-tbkoNavy font-semibold" required>
    </div>
  </div>

  <!-- Item Quantity Selection (Catalog Only) -->
  <div id="catalogQtySection" class="bg-white p-4 rounded-xl shadow-sm border mb-4">
    <div class="flex justify-between items-center">
      <label class="text-xs font-bold text-tbkoNavy">የዕቃዎች ብዛት (Quantity)፦</label>
      <input type="number" id="catalogQty" value="1" min="1" onchange="calculatePrices()" onkeyup="calculatePrices()" class="w-20 text-xs p-2 border rounded-lg text-center font-bold">
    </div>
  </div>

  <!-- Delivery Method Selection -->
  <div class="bg-white p-4 rounded-xl shadow-sm border mb-4">
    <h3 class="font-bold text-xs text-tbkoNavy mb-3">የመረከቢያ መንገድ</h3>
    
    <div class="space-y-3 text-xs">
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="radio" name="deliveryOption" value="Pickup" checked class="text-tbkoNavy" onchange="handleDeliveryChange()"> 
        <span class="font-semibold">ከሱቅ እወስዳለሁ (Pickup)</span>
      </label>
      
      <div id="pickupBranchSection" class="pl-6">
        <label class="block text-[11px] text-gray-500 mb-1">የሚቀርብዎትን ቅርንጫፍ ይምረጡ፦</label>
        <select id="pickupBranch" class="w-full text-xs p-2.5 border rounded-lg bg-slate-50 text-tbkoNavy font-medium">
          <option value="ቄራ (Kera)">ቄራ</option>
          <option value="ተክለሃይማኖት (Teklehaimanot)">ተክለሃይማኖት</option>
          <option value="ሜክሲኮ (Mexico)">ሜክሲኮ</option>
          <option value="ፒያሳ (Piassa)">ፒያሳ</option>
        </select>
      </div>

      <hr class="my-2 border-gray-100">

      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="radio" name="deliveryOption" value="Delivery" class="text-tbkoNavy" onchange="handleDeliveryChange()"> 
        <span class="font-semibold">መላኪያ (Delivery)</span>
      </label>

      <div id="deliveryLocationSection" class="pl-6 space-y-2 hidden">
        <div>
          <label class="block text-[11px] text-gray-500 mb-1">የመላኪያ ክልል/ቦታ ይምረጡ፦</label>
          <select id="deliveryZone" onchange="calculatePrices()" class="w-full text-xs p-2.5 border rounded-lg bg-slate-50 text-tbkoNavy font-medium">
            <option value="AddisAbaba" data-fee="150">አዲስ አበባ ውስጥ (150 ETB)</option>
            <option value="Regional" data-fee="300">ክፍለ ሀገር (300 ETB)</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] text-gray-500 mb-1">ትክክለኛ አድራሻ (ክፍለ ከተማ / ሰፈር)፦</label>
          <input type="text" id="deliveryAddress" placeholder="ምሳሌ፦ ቦሌ መድኃኔዓለም / ቂርቆስ ወረዳ 02" class="w-full text-xs p-2.5 border rounded-lg bg-slate-50">
        </div>
      </div>
    </div>
  </div>

  <!-- Pricing & Advance Breakdown -->
  <div class="bg-white p-4 rounded-xl shadow-sm border space-y-2 mb-4 text-xs">
    <div class="flex justify-between text-gray-600">
      <span>የዕቃዎች ዋጋ:</span>
      <span id="itemsTotal">800 ETB</span>
    </div>
    <div class="flex justify-between text-gray-600">
      <span>የትራንስፖርት ክፍያ:</span>
      <span id="deliveryFee">0 ETB</span>
    </div>
    <hr class="my-1">
    <div class="flex justify-between font-bold text-sm text-tbkoNavy">
      <span>ጠቅላላ ሂሳብ:</span>
      <span id="grandTotal">800 ETB</span>
    </div>

    <!-- Advance Payment Dynamic Box -->
    <div id="advanceRuleBox" class="mt-3 p-3 rounded-lg border bg-amber-50 border-amber-200 text-amber-900">
      <div class="flex justify-between font-extrabold text-xs">
        <span id="advanceRuleTitle">የሚፈለግ ቅድመ ክፍያ (ቀብድ)፦</span>
        <span id="requiredAdvanceText" class="text-tbkoRust text-sm">0 ETB</span>
      </div>
      <p id="advanceRuleNote" class="text-[10px] text-amber-700 mt-1 font-semibold"></p>
    </div>
  </div>

  <!-- Bank Details & Receipt Upload -->
  <div class="bg-white p-4 rounded-xl shadow-sm border space-y-3 mb-4">
    <h3 class="font-bold text-xs text-tbkoNavy">የክፍያ አካውንቶች</h3>
    <div class="bg-slate-50 p-3 rounded-lg border text-xs text-gray-700 space-y-1">
      <p class="font-bold">🏦 CBE: <span class="font-mono text-tbkoNavy">1000123456789</span></p>
      <p class="font-bold">📲 Telebirr: <span class="font-mono text-tbkoNavy">0911223344</span></p>
      <p class="text-[10px] text-gray-500">ስም: tibko WEAR</p>
    </div>

    <div>
      <label class="block text-xs font-bold text-tbkoNavy mb-1">
        የክፍያ ደረሰኝ (Screenshot) <span id="receiptRequiredTag" class="text-red-500">*</span>
      </label>
      <input type="file" id="receiptInput" accept="image/*" class="w-full text-xs text-gray-500 border rounded-lg p-2 bg-slate-50">
    </div>
  </div>

  <!-- Submit Button -->
  <button id="submitBtn" onclick="confirmOrder()" class="w-full bg-tbkoNavy hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
    ትዕዛዝ አረጋግጥ (Submit Order) 🚀
  </button>

  <script>
    // 1. Firebase & ImgBB Configuration
    const IMGBB_API_KEY = "80c60dbefb464422c2ac7c852bf5c9fc";
    const firebaseConfig = {
      apiKey: "AIzaSyCwU7g2s-xRCG3VsipwlqoA5F5R6oPcNdM",
      authDomain: "tibko-wear.firebaseapp.com",
      databaseURL: "https://tibko-wear-default-rtdb.firebaseio.com",
      projectId: "tibko-wear",
      storageBucket: "tibko-wear.firebasestorage.app",
      messagingSenderId: "596607988947",
      appId: "1:596607988947:web:c9e27c89d063c97492502"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Generate Order ID (#TBK-XXXX)
    const randomNum = Math.floor(1000 + Math.random() * 9000);
    const currentOrderId = `#TBK-${randomNum}`;
    document.getElementById('orderIdTag').innerText = currentOrderId;

    let pendingCustomOrder = null;
    let catalogSelectedItem = null;
    let CATALOG_UNIT_PRICE = 800; 

    // Initialize Telegram WebApp SDK
    let tgUser = null;
    let tgChatId = null;

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      tgUser = window.Telegram.WebApp.initDataUnsafe?.user || null;
      tgChatId = tgUser?.id || null;
    }

    // Load Order Data & Auto-fill Username on Page Load
    window.onload = function() {
      if (tgUser && tgUser.username) {
        document.getElementById('tgUsername').value = `@${tgUser.username}`;
      }

      const savedCustomData = localStorage.getItem('tbko_pending_order');
      if (savedCustomData) {
        pendingCustomOrder = JSON.parse(savedCustomData);
        if (pendingCustomOrder.phone) {
          document.getElementById('phone').value = pendingCustomOrder.phone;
        }
        document.getElementById('catalogQtySection').classList.add('hidden');
      } else {
        const savedCatalogData = localStorage.getItem('tbko_catalog_item');
        if (savedCatalogData) {
          catalogSelectedItem = JSON.parse(savedCatalogData);
          if (catalogSelectedItem.unitPrice) {
            CATALOG_UNIT_PRICE = Number(catalogSelectedItem.unitPrice);
          }
        }
      }
      calculatePrices();
    };

    function handleDeliveryChange() {
      const selectedOption = document.querySelector('input[name="deliveryOption"]:checked').value;
      const pickupSection = document.getElementById('pickupBranchSection');
      const deliverySection = document.getElementById('deliveryLocationSection');

      if (selectedOption === 'Pickup') {
        pickupSection.classList.remove('hidden');
        deliverySection.classList.add('hidden');
      } else {
        pickupSection.classList.add('hidden');
        deliverySection.classList.remove('hidden');
      }
      calculatePrices();
    }

    function calculatePrices() {
      const selectedDelivery = document.querySelector('input[name="deliveryOption"]:checked').value;
      let deliveryFee = 0;

      if (selectedDelivery === 'Delivery') {
        const zoneSelect = document.getElementById('deliveryZone');
        const selectedOption = zoneSelect.options[zoneSelect.selectedIndex];
        deliveryFee = parseInt(selectedOption.getAttribute('data-fee')) || 0;
      }

      document.getElementById('deliveryFee').innerText = deliveryFee + " ETB";

      let itemsTotal = 0;
      let requiredAdvance = 0;
      let note = "";
      const receiptTag = document.getElementById('receiptRequiredTag');

      if (pendingCustomOrder) {
        // Custom Order Logic (50% Advance)
        itemsTotal = Number(pendingCustomOrder.totalAmount || 0);
        requiredAdvance = (itemsTotal * 0.50) + deliveryFee;
        note = "ℹ️ ለCustom ዲዛይን 50% ቅድመ ክፍያ + የትራንስፖርት ክፍያ መከፈል አለበት።";
        if (receiptTag) receiptTag.innerText = "*";
      } else {
        // Catalog Order Logic
        const qtyInput = document.getElementById('catalogQty');
        let qty = parseInt(qtyInput.value) || 1;
        if (qty < 1) {
          qty = 1;
          qtyInput.value = 1;
        }

        itemsTotal = qty * CATALOG_UNIT_PRICE;

        if (qty === 1) {
          requiredAdvance = 0;
          note = "💡 ለ 1 እቃ ቅድመ ክፍያ (ቀብድ) መክፈልና ደረሰኝ ማያያዝ አይጠበቅብዎትም! እቃውን ሲረከቡ ሙሉ ሂሳቡን መክፈል ይችላሉ።";
          if (receiptTag) receiptTag.innerText = "(ምርጫዊ)";
        } else {
          requiredAdvance = Math.round(itemsTotal * 0.30) + deliveryFee;
          note = "ℹ️ ለ 2 እና ከዚያ በላይ እቃዎች 30% ቅድመ ክፍያ + የትራንስፖርት ክፍያ ይፈለጋል።";
          if (receiptTag) receiptTag.innerText = "*";
        }
      }

      const grandTotal = itemsTotal + deliveryFee;

      document.getElementById('itemsTotal').innerText = itemsTotal + " ETB";
      document.getElementById('grandTotal').innerText = grandTotal + " ETB";
      document.getElementById('requiredAdvanceText').innerText = requiredAdvance + " ETB";
      document.getElementById('advanceRuleNote').innerText = note;
    }

    async function confirmOrder() {
      const phone = document.getElementById('phone').value.trim();
      let tgUsernameInput = document.getElementById('tgUsername').value.trim();
      const receiptInput = document.getElementById('receiptInput');

      if (!phone) {
        alert("እባክዎን ስልክ ቁጥርዎን ያስገቡ!");
        return;
      }

      if (!tgUsernameInput) {
        alert("እባክዎን የቴሌግራም ዩዘርኔምዎን ያስገቡ!");
        return;
      }

      const cleanUsername = tgUsernameInput.replace('@', '');
      if (!tgUsernameInput.startsWith('@')) {
        tgUsernameInput = '@' + tgUsernameInput;
      }

      const catalogQty = parseInt(document.getElementById('catalogQty')?.value || "1");
      const isReceiptMandatory = pendingCustomOrder || catalogQty > 1;

      if (isReceiptMandatory && receiptInput.files.length === 0) {
        alert("ለዚህ ትዕዛዝ የክፍያ ደረሰኝ (Screenshot) ማያያዝ ግዴታ ነው!");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "ትዕዛዝ በመላክ ላይ... ⏳";

      const selectedDelivery = document.querySelector('input[name="deliveryOption"]:checked').value;
      let locationDetails = {};

      if (selectedDelivery === 'Pickup') {
        locationDetails = {
          method: "Pickup",
          branch: document.getElementById('pickupBranch').value
        };
      } else {
        const address = document.getElementById('deliveryAddress').value.trim();
        if (!address) {
          alert("እባክዎን የመላኪያ አድራሻዎን ያስገቡ!");
          btn.disabled = false;
          btn.innerText = "ትዕዛዝ አረጋግጥ (Submit Order) 🚀";
          return;
        }
        const zoneSelect = document.getElementById('deliveryZone');
        locationDetails = {
          method: "Delivery",
          zone: zoneSelect.options[zoneSelect.selectedIndex].text,
          address: address
        };
      }

      try {
        let receiptUrl = "";

        // 1. Upload Receipt to ImgBB only if image is selected
        if (receiptInput.files.length > 0) {
          const file = receiptInput.files[0];
          const base64Image = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
          });

          const formData = new FormData();
          formData.append("image", base64Image);

          const imgRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
          });
          
          const imgData = await imgRes.json();

          if (!imgData.success) {
            throw new Error(imgData.error?.message || "የደረሰኝ ፎቶ መጫን አልተቻለም።");
          }

          receiptUrl = imgData.data.url;
        }

        // 2. Build Payload
        const payload = {
          orderId: currentOrderId,
          orderType: pendingCustomOrder ? "CUSTOM_ORDER" : "CATALOG_ORDER",
          phone: phone,
          telegramUser: tgUsernameInput,
          chatId: tgChatId,
          deliveryInfo: locationDetails,
          itemsTotal: document.getElementById('itemsTotal').innerText,
          deliveryFee: document.getElementById('deliveryFee').innerText,
          grandTotal: document.getElementById('grandTotal').innerText,
          requiredAdvance: document.getElementById('requiredAdvanceText').innerText,
          receiptImage: receiptUrl || "ያልተያያዘ (በብዛት 1 ወይም በቆይታ የሚከፈል)",
          status: "Pending",
          timestamp: Date.now(),
          orderDetails: pendingCustomOrder ? pendingCustomOrder : {
            productTitle: catalogSelectedItem ? catalogSelectedItem.title : "Catalog T-Shirt",
            qty: catalogQty,
            unitPrice: CATALOG_UNIT_PRICE
          }
        };

        // 3. Save Order to Firebase Database
        const cleanOrderId = currentOrderId.replace('#', '');
        await db.ref('orders/' + cleanOrderId).set(payload);

        alert(`ትዕዛዝዎ በስኬት ተልኳል!\nትዕዛዝ ቁጥር፦ ${currentOrderId}`);

        // 4. Safe Send Data to Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
          try {
            window.Telegram.WebApp.sendData(JSON.stringify(payload));
          } catch (e) {
            console.log("sendData ignored or failed safely:", e);
          }
        }

        // 5. Automatical Message 1 Redirect directly to User's Telegram
        const autoMsgText = encodeURIComponent(`ሰላም! 👋 ከ tibko WEAR ነው። ትዕዛዝዎ ደርሶናል፤ ትንሽ ይታገሱ ትዕዛዝዎ ክትትል ላይ ነው። ⏳\n\n🆔 ትዕዛዝ ቁጥር፦ ${currentOrderId}\n💰 ጠቅላላ ሂሳብ፦ ${payload.grandTotal}`);
        const tgDirectUrl = `https://t.me/${cleanUsername}?text=${autoMsgText}`;

        // Clear Local Storage
        localStorage.removeItem('tbko_pending_order');
        localStorage.removeItem('tbko_catalog_item');

        // Redirect user automatically to their chat/Telegram link
        window.open(tgDirectUrl, '_blank');

        // Close WebApp or Redirect to catalog
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.close();
        } else {
          window.location.href = "index.html";
        }

      } catch (err) {
        console.error("Error submitting order:", err);
        alert("ችግር አጋጥሟል፦ " + err.message);
        btn.disabled = false;
        btn.innerText = "ትዕዛዝ አረጋግጥ (Submit Order) 🚀";
      }
    }
  </script>
</body>
</html>
