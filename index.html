<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBKO WEAR - Catalog</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tbkoNavy: '#1D3B6A',
            tbkoRust: '#B85C28',
            tbkoGold: '#D6923E',
            tbkoBg: '#F8F9FA'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-tbkoBg text-gray-800 font-sans pb-20">

  <!-- Header with Logo Image and Text -->
  <header class="bg-tbkoNavy text-white p-3 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <!-- ሎጎው እዚህ ገብቷል -->
      <img src="Tibko logo.jpg" alt="Tibko Logo" class="h-10 w-auto bg-white p-1 rounded-lg object-contain shadow-sm">
      <div>
        <h1 class="text-base font-bold tracking-wider leading-none">TBKO WEAR</h1>
        <p class="text-[10px] text-tbkoGold italic mt-0.5">Wear Your Identity</p>
      </div>
    </div>
    <div class="relative">
      <!-- ወደ checkout.html የሚወስድ ሊንክ -->
      <a href="checkout.html" class="bg-tbkoRust p-2 rounded-full text-white font-bold text-sm inline-block shadow">
        🛒 <span id="cartCount" class="bg-white text-tbkoNavy text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
      </a>
    </div>
  </header>

  <!-- Banner / Custom Order CTA -->
  <div class="m-4 p-4 bg-gradient-to-r from-tbkoNavy to-slate-800 text-white rounded-2xl shadow-lg flex justify-between items-center">
    <div>
      <h2 class="font-bold text-lg">የራስዎን ዲዛይን ያትሙ!</h2>
      <p class="text-xs text-gray-300">ምስል ወይም ፅሁፍ በመላክ ብጁ ቲሸርት ይዘዙ</p>
      <!-- ወደ custom.html የሚወስድ ሊንክ -->
      <a href="custom.html" class="inline-block mt-3 bg-tbkoRust hover:bg-orange-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow">
        Custom Order ➔
      </a>
    </div>
    <div class="text-4xl">🎨</div>
  </div>

  <!-- Categories Filter (Single Page Navigation) -->
  <div class="flex space-x-2 px-4 overflow-x-auto py-2" id="categoryButtons">
    <button onclick="filterCategory('all', this)" class="cat-btn active-cat bg-tbkoNavy text-white text-xs font-medium px-4 py-2 rounded-full whitespace-nowrap shadow-sm">
      ሁሉም
    </button>
    <button onclick="filterCategory('casual', this)" class="cat-btn bg-white text-tbkoNavy border border-tbkoNavy text-xs font-medium px-4 py-2 rounded-full whitespace-nowrap shadow-sm">
      Casual Tees
    </button>
    <button onclick="filterCategory('polo', this)" class="cat-btn bg-white text-tbkoNavy border border-tbkoNavy text-xs font-medium px-4 py-2 rounded-full whitespace-nowrap shadow-sm">
      Polo
    </button>
    <button onclick="filterCategory('cultural', this)" class="cat-btn bg-white text-tbkoNavy border border-tbkoNavy text-xs font-medium px-4 py-2 rounded-full whitespace-nowrap shadow-sm">
      Cultural Prints
    </button>
  </div>

  <!-- Dynamic Product Grid -->
  <div class="p-4 grid grid-cols-2 gap-4" id="productGrid">
    <!-- Products will load dynamically from products.json -->
  </div>

  <!-- JavaScript Logic -->
  <script>
    // 1. Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // 2. Dynamic Fetch and Render Products
    async function fetchProducts() {
      const grid = document.getElementById('productGrid');
      try {
        const response = await fetch('products.json');
        if (!response.ok) throw new Error("ለማንበብ አልተቻለም");
        
        const products = await response.json();
        grid.innerHTML = '';

        products.forEach(product => {
          const productDiv = document.createElement('div');
          productDiv.className = `product-item ${product.category} bg-white rounded-xl shadow border border-gray-100 overflow-hidden flex flex-col justify-between`;
          
          const tagHTML = product.tag ? `<span class="absolute top-2 left-2 ${product.tagColor || 'bg-tbkoGold'} text-white text-[10px] font-bold px-2 py-0.5 rounded">${product.tag}</span>` : '';

          productDiv.innerHTML = `
            <div class="relative">
              ${tagHTML}
              <img src="${product.image}" alt="${product.title}" class="w-full h-40 object-cover">
            </div>
            <div class="p-3">
              <h3 class="font-bold text-tbkoNavy text-sm">${product.title}</h3>
              <p class="text-xs text-gray-500 my-1">${product.subtitle || ''}</p>
              <div class="flex justify-between items-center mt-2">
                <span class="font-extrabold text-tbkoRust text-sm">${product.price.toLocaleString()} ETB</span>
                <button onclick="addToCart('${product.id}', '${product.title}', ${product.price})" class="bg-tbkoNavy text-white text-xs px-2.5 py-1.5 rounded-lg hover:bg-blue-900 shadow">+ Add</button>
              </div>
            </div>
          `;
          grid.appendChild(productDiv);
        });

      } catch (error) {
        console.error("Error loading products:", error);
        grid.innerHTML = `<p class="col-span-2 text-center text-xs text-red-500 py-6">ምርቶችን መጫን አልተቻለም።</p>`;
      }
    }

    // 3. Category Filter Logic
    function filterCategory(category, clickedBtn) {
      const items = document.querySelectorAll('.product-item');
      const buttons = document.querySelectorAll('.cat-btn');

      // Style resetting for category buttons
      buttons.forEach(btn => {
        btn.classList.remove('bg-tbkoNavy', 'text-white');
        btn.classList.add('bg-white', 'text-tbkoNavy', 'border', 'border-tbkoNavy');
      });

      // Highlight selected button
      clickedBtn.classList.remove('bg-white', 'text-tbkoNavy', 'border', 'border-tbkoNavy');
      clickedBtn.classList.add('bg-tbkoNavy', 'text-white');

      // Show/Hide Products
      items.forEach(item => {
        if (category === 'all' || item.classList.contains(category)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    // 4. Cart Counter & Storage Logic
    let cartCount = 0;
    function addToCart(id, title, price) {
      cartCount++;
      document.getElementById('cartCount').innerText = cartCount;

      // Save product details to localStorage for checkout
      const selectedProduct = {
        isCustom: false,
        productId: id,
        title: title,
        unitPrice: price
      };
      localStorage.setItem('tbko_catalog_item', JSON.stringify(selectedProduct));
    }

    // Load products on window startup
    window.onload = fetchProducts;
  </script>

</body>
</html>
